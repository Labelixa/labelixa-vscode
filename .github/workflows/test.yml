name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22"
      # No dependencies and no lock file: nothing to install.
      - run: node scripts/check-publish.mjs
      # Smoke test against the live API (the package has no mocks by design:
      # if the API contract drifts, this is where it shows).
      - run: node test/smoke.js https://api.labelixa.com
